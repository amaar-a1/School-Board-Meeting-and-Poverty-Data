    <div id="pageViewData" data-value="{&quot;DateTaxonomyTerm&quot;:{&quot;ID&quot;:&quot;7593&quot;,&quot;ClassName&quot;:&quot;DateTaxonomyTerm&quot;,&quot;Date&quot;:null,&quot;DisplayName&quot;:&quot;Child poverty statistics: Year ended June 2024&quot;,&quot;DateFormat&quot;:&quot;F Y&quot;,&quot;DateString&quot;:&quot;20 February 2025&quot;,&quot;PublicationDate&quot;:&quot;2025-02-20 10:45:00&quot;},&quot;ID&quot;:&quot;79542&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024&quot;,&quot;ClassName&quot;:&quot;BlockPage&quot;,&quot;BackgroundColor&quot;:&quot;white&quot;,&quot;FeaturedMedia&quot;:{&quot;ID&quot;:126735,&quot;SeriesData&quot;:[{&quot;ID&quot;:33545,&quot;Title&quot;:&quot;Line&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffYear ended June,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023 R,2024\r\nPercent,14.5,16.3,15.4,14.2,16.5,13.5,13.2,13,11.7,12.2,12.7\r\n&quot;},{&quot;ID&quot;:33546,&quot;Title&quot;:&quot;Error&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;errorbar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeff13.4,15.6\r\n15.2,17.4\r\n14.3,16.5\r\n13.1,15.3\r\n15.4,17.6\r\n12.6,14.4\r\n12,14.4\r\n11.8,14.2\r\n10,13.4\r\n10.9,13.5\r\n11.7,13.7\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;GraphHeading&quot;:&quot;Measure (a): Percentage of children living in households with less than 50 percent median equivalised disposable household income before housing costs are deducted, year ended June 2014\u20132024&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;},&quot;FeaturedText&quot;:&quot;&lt;p&gt;Child poverty statistics provide estimates of low income and material hardship rates for measures listed in the Child Poverty Reduction Act 2018.&lt;\/p&gt;&quot;,&quot;IsPublishing&quot;:false,&quot;MediaPosition&quot;:&quot;&quot;,&quot;PageLayout&quot;:&quot;info&quot;,&quot;PageLink&quot;:&quot;\/information-releases\/child-poverty-statistics-year-ended-june-2024\/&quot;,&quot;PageDate&quot;:&quot;2025-02-20 10:45:00&quot;,&quot;TagPosition&quot;:&quot;bottom&quot;,&quot;MetaDescription&quot;:&quot;In the year ended June 2024, 12.7 percent of children lived in households with less than 50 percent of the median equivalised disposable household income before housing costs were deducted (measure (a) of the Child Poverty Reduction Act 2018).&quot;,&quot;PageBreadcrumbs&quot;:[{&quot;Title&quot;:&quot;Home&quot;,&quot;MenuTitle&quot;:&quot;Home&quot;,&quot;Link&quot;:&quot;\/&quot;},{&quot;Title&quot;:&quot;Information releases&quot;,&quot;MenuTitle&quot;:&quot;Information releases&quot;,&quot;Link&quot;:&quot;\/information-releases\/&quot;},{&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024&quot;,&quot;MenuTitle&quot;:&quot;Child poverty statistics: Year ended June 2024&quot;,&quot;Link&quot;:&quot;\/information-releases\/child-poverty-statistics-year-ended-june-2024\/&quot;}],&quot;SiteBanner&quot;:[],&quot;PageBlocks&quot;:[{&quot;ID&quot;:&quot;126944&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;intro\&quot;&gt;Child poverty statistics provide estimates of low income and material hardship rates for measures listed in the &lt;a href=\&quot;https:\/\/www.legislation.govt.nz\/act\/public\/2018\/0057\/latest\/LMS8294.html\&quot;&gt;Child Poverty Reduction Act 2018&lt;\/a&gt;.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;There are three primary measures of child poverty, and six supplementary measures. Targets for the primary measures are required to be set by the responsible minister.&lt;\/p&gt;\n&lt;p&gt;Statistics for all nine child poverty measures, including annual changes, are available in the files under &lt;a href=\&quot;\/information-releases\/child-poverty-statistics-year-ended-june-2024\/#download_data\&quot;&gt;Download Data&lt;\/a&gt; below. Figures are available by ethnicity and disability status, as well as regional council area.&lt;\/p&gt;\n&lt;p&gt;The Household Economic Survey (HES), from which these latest measures were estimated, was conducted between July 2023 and June 2024.&amp;nbsp;Households were asked to report income and expenditure for the 12 months prior to interview. This means that for some households, income will refer to income received in the 2022\/2023 year.&lt;\/p&gt;\n&lt;p&gt;The published estimates are subject to some uncertainty because not everyone in Aotearoa New Zealand was surveyed. This range of uncertainty should be considered when looking at year-on-year changes. Stats NZ encourages users to look at trends over several years where possible. Small changes year-on-year are unlikely to be statistically significant because they fall within the range of expected uncertainty.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/child-poverty-statistics-year-ended-june-2024-technical-appendix\/\&quot;&gt;Child poverty statistics: Year ended June 2024 \u2013 technical appendix&lt;\/a&gt; has more information about the survey and methodology used for estimating child poverty rates.&lt;\/p&gt;\n&lt;div style=\&quot;background-color: #f6f6f6; border-left: #ec6607 3px solid; padding: 30px;\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;28 February 2025&lt;\/strong&gt;: We have corrected a year reference in the \u2018cp-national-datafile-csv\u2019 file, which is included in the downloadable zipped \u2018Child poverty statistics: Year ended June 2024 \u2013 CSV \u2013 corrected\u2019 file below.&lt;\/p&gt;\n&lt;p&gt;Lines 537\u2013541 now correctly refer to 2024 instead of 2023.&lt;a id=\&quot;download_data\&quot;&gt;&lt;\/a&gt;&lt;\/p&gt;\n&lt;\/div&gt;&quot;},{&quot;ID&quot;:&quot;126901&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 download data&quot;,&quot;ClassName&quot;:&quot;DocumentBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;BlockDocuments&quot;:[{&quot;ID&quot;:&quot;118216&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;child-poverty-statistics-year-ended-june-2024.xlsx&quot;,&quot;FileName&quot;:&quot;child-poverty-statistics-year-ended-june-2024.xlsx&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:116643,&quot;OwnerID&quot;:250,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Child-poverty-statistics\/Child-poverty-statistics-Year-ended-June-2024\/Download-data\/child-poverty-statistics-year-ended-june-2024.xlsx&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xlsx&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1793625164&quot;,&quot;DocumentSize&quot;:&quot;227 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;118215&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;child-poverty-statistics-year-ended-june-2024-corrected.zip&quot;,&quot;FileName&quot;:&quot;child-poverty-statistics-year-ended-june-2024-corrected.zip&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 CSV \u2013 corrected&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:116643,&quot;OwnerID&quot;:250,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Child-poverty-statistics\/Child-poverty-statistics-Year-ended-June-2024\/Download-data\/child-poverty-statistics-year-ended-june-2024-corrected.zip&quot;,&quot;DocumentCategory&quot;:&quot;archive&quot;,&quot;DocumentExtension&quot;:&quot;zip&quot;,&quot;DocumentFileType&quot;:&quot;ZIP compressed file&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/archive_92.png?m=1793625164&quot;,&quot;DocumentSize&quot;:&quot;73 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;118217&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;child-poverty-statistics-year-ended-june-2024-summary-table.xlsx&quot;,&quot;FileName&quot;:&quot;child-poverty-statistics-year-ended-june-2024-summary-table.xlsx&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 summary table&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:116643,&quot;OwnerID&quot;:250,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Child-poverty-statistics\/Child-poverty-statistics-Year-ended-June-2024\/Download-data\/child-poverty-statistics-year-ended-june-2024-summary-table.xlsx&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xlsx&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1793625164&quot;,&quot;DocumentSize&quot;:&quot;23 KB&quot;,&quot;DocumentPreviewImage&quot;:false}],&quot;Heading&quot;:&quot;Download data&quot;,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}},&quot;Presentation&quot;:null},{&quot;ID&quot;:&quot;126375&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;\n&lt;p&gt;In the year ended June 2024:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For the primary measures:\n&lt;ul&gt;\n&lt;li&gt;12.7 percent of children lived in households with less than 50 percent of the median equivalised disposable household income before housing costs were deducted (measure (a) of the Child Poverty Reduction Act 2018)\n&lt;ul&gt;\n&lt;li&gt;There was no statistically significant change from the year ended June 2023.&lt;\/li&gt;\n&lt;li&gt;There was no statistically significant change from the year ended June 2021 (the end of the first three-year target period).&lt;\/li&gt;\n&lt;li&gt;The rate was &lt;strong&gt;down&lt;\/strong&gt; 3.8 percentage points from the year ended June 2018 (the baseline year).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;li&gt;17.7 percent of children lived in households with less than 50 percent of the baseline year\u2019s median equivalised disposable household income after housing costs were deducted (measure (b))\n&lt;ul&gt;\n&lt;li&gt;There was no statistically significant change from the year ended June 2023.&lt;\/li&gt;\n&lt;li&gt;The rate was &lt;strong&gt;up&lt;\/strong&gt; 2.7 percentage points from the year ended June 2021 (the end of the first three-year target period).&lt;\/li&gt;\n&lt;li&gt;The rate was &lt;strong&gt;down&lt;\/strong&gt; 5.1 percentage points from the year ended June 2018 (the baseline year).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;li&gt;13.4 percent of children lived in households in material hardship (measure (c))\n&lt;ul&gt;\n&lt;li&gt;There was no statistically significant change from the year ended June 2023.&lt;\/li&gt;\n&lt;li&gt;The rate was &lt;strong&gt;up&lt;\/strong&gt; 2.4 percentage points from the year ended June 2021 (the end of the first three-year target period).&lt;\/li&gt;\n&lt;li&gt;There was no statistically significant change from the year ended June 2018 (the baseline year).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;li&gt;For tamariki M\u0101ori, Pacific children, and disabled children, there were no statistically significant changes across the three primary measures from the year ended June 2023, the year ended June 2021, or since reporting on these poverty rates began.&lt;\/li&gt;\n&lt;li&gt;The targets for the three primary measures of child poverty for the second three-year intermediate target period (July 2021 to June 2024) were not met.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;A change between two years is considered statistically significant if the difference between the estimates is larger than the sample error on the change.&lt;\/p&gt;\n&lt;h2&gt;Interpreting child poverty targets&lt;\/h2&gt;\n&lt;p&gt;Under the Child Poverty Reduction Act 2018 (the Act), the Minister is required to set intermediate (three-year) and long term (10-year) targets for reducing child poverty in Aotearoa New Zealand. The second three-year intermediate targets for the three primary measures were set in June 2021. The target period ends with the statistics reported for the year ended June 2024.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/gazette.govt.nz\/notice\/id\/2021-go2605\&quot;&gt;Notification of setting of targets under the Child Poverty Reduction Act 2018&lt;\/a&gt; is the Gazette notice for the targets for reducing child poverty, set in June 2021.&lt;\/p&gt;\n&lt;p&gt;Because the HES only surveys a sample of New Zealand, the estimates it produces are subject to some uncertainty on their true value. We can create a confidence interval around an estimate, with an upper and lower bound. A target is met if the lower bound for the end-of-period rate is lower than, or equal to, the target rate.&lt;\/p&gt;\n&lt;p&gt;The following table shows the estimates used to assess compliance with the targets under the Act.&lt;\/p&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;height: 100%; width: 100%;\&quot;&gt;\n&lt;tbody&gt;\n&lt;tr style=\&quot;height: 43px;\&quot;&gt;\n&lt;td style=\&quot;height: 109px; width: 406.516px;\&quot; rowspan=\&quot;2\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Measure of &lt;\/strong&gt;&lt;strong&gt;child poverty&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 109px; width: 135.062px;\&quot; rowspan=\&quot;2\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Second &lt;br&gt;3-year &lt;br&gt;target&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; style=\&quot;width: 258.266px; height: 43px;\&quot; colspan=\&quot;3\&quot;&gt;\n&lt;p class=\&quot;text-center\&quot;&gt;&lt;strong&gt;Year ended June 2024&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 109px; width: 87.5312px;\&quot; rowspan=\&quot;2\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Result&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr style=\&quot;height: 66px;\&quot;&gt;\n&lt;td style=\&quot;height: 66px; width: 79.0312px;\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Lower &lt;br&gt;bound&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 66px; width: 100.203px; vertical-align: middle;\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Estimate&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 66px; width: 79.0312px;\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Upper &lt;br&gt;bound&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr style=\&quot;height: 112px;\&quot;&gt;\n&lt;td style=\&quot;height: 112px; width: 406.516px;\&quot;&gt;\n&lt;p&gt;A: Percentage of children living in households&lt;br&gt;with less than 50 percent of the median&lt;br&gt;equivalised disposable household income&lt;br&gt;before housing costs are deducted&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 112px; width: 135.062px;\&quot;&gt;\n&lt;p&gt;10.0%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 112px; width: 79.0312px;\&quot;&gt;\n&lt;p&gt;11.7%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 112px; width: 100.203px;\&quot;&gt;\n&lt;p&gt;12.7%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 112px; width: 79.0312px;\&quot;&gt;\n&lt;p&gt;13.7%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 112px; width: 87.5312px;\&quot;&gt;\n&lt;p&gt;Not met&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr style=\&quot;height: 134px;\&quot;&gt;\n&lt;td style=\&quot;height: 134px; width: 406.516px;\&quot;&gt;\n&lt;p&gt;B: Percentage of children living in households &lt;br&gt;with less than 50 percent of the median &lt;br&gt;equivalised disposable household income &lt;br&gt;after housing costs are deducted &lt;br&gt;(for the 2017\/18 base financial year)&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 134px; width: 135.062px;\&quot;&gt;\n&lt;p&gt;15.0%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 134px; width: 79.0312px;\&quot;&gt;\n&lt;p&gt;16.5%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 134px; width: 100.203px;\&quot;&gt;\n&lt;p&gt;17.7%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 134px; width: 79.0312px;\&quot;&gt;\n&lt;p&gt;18.9%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 134px; width: 87.5312px;\&quot;&gt;\n&lt;p&gt;Not met&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr style=\&quot;height: 66px;\&quot;&gt;\n&lt;td style=\&quot;height: 66px; width: 406.516px;\&quot;&gt;\n&lt;p&gt;C: Percentage of children living in households &lt;br&gt;that experience material hardship&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 66px; width: 135.062px;\&quot;&gt;\n&lt;p&gt;9.0%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 66px; width: 79.0312px;\&quot;&gt;\n&lt;p&gt;12.3%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 66px; width: 100.203px;\&quot;&gt;\n&lt;p&gt;13.4%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 66px; width: 79.0312px;\&quot;&gt;\n&lt;p&gt;14.5%&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;height: 66px; width: 87.5312px;\&quot;&gt;\n&lt;p&gt;Not met&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr style=\&quot;height: 43px;\&quot;&gt;\n&lt;td style=\&quot;height: 43px; width: 887.375px;\&quot; colspan=\&quot;6\&quot;&gt;\n&lt;p&gt;Source: &lt;strong&gt;Stats NZ&lt;\/strong&gt;, Household Economic Survey (HES)&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;&lt;br&gt;&lt;a href=\&quot;\/methods\/interpreting-child-poverty-targets\/\&quot;&gt;Interpreting child poverty targets&lt;\/a&gt; sets out how to interpret whether a target was met under the Act.&lt;\/p&gt;\n&lt;h2&gt;Low income &lt;em&gt;before&lt;\/em&gt; deducting housing costs \u2013 measure (a)&lt;\/h2&gt;\n&lt;p&gt;In the year ended June 2024, 12.7 percent of children lived in households that had less than 50 percent of the median equivalised disposable household income before housing costs were deducted (measure (a)).&lt;\/p&gt;\n&lt;p&gt;There was no statistically significant change to the rate from the year ended June 2023, or from the year ended June 2021. The rate decreased by 3.8 percentage points from the baseline year ended June 2018.&lt;\/p&gt;\n&lt;p&gt;This measure of child poverty involves comparing a household\u2019s income for the previous 12 months with the median for all households for the year ended June 2024. For this measure to decrease over time, the incomes of low-income households would need to rise by more than the rise in the median household income.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;126735&quot;,&quot;Title&quot;:&quot;CPS Jun24 \u2013 g1 \u2013 Measure (a): Percentage of children living in households with less than 50 percent median equivalised disposable household income before housing costs are deducted, year ended June 2014\u20132024&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Year ended June&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:&quot;&lt;p&gt;Household income after tax is \u2018equivalised\u2019, meaning that it is adjusted for the number of people in the household and their age, to allow for comparisons between households.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/methods\/child-poverty-statistics-year-ended-june-2024-technical-appendix\&quot;&gt;Child poverty statistics: Year ended June 2024 \u2012 technical appendix&lt;\/a&gt; provides more information on how this is calculated.&lt;\/p&gt;&quot;,&quot;SeriesData&quot;:[{&quot;ID&quot;:33545,&quot;Title&quot;:&quot;Line&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffYear ended June,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023 R,2024\r\nPercent,14.5,16.3,15.4,14.2,16.5,13.5,13.2,13,11.7,12.2,12.7\r\n&quot;},{&quot;ID&quot;:33546,&quot;Title&quot;:&quot;Error&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;errorbar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeff13.4,15.6\r\n15.2,17.4\r\n14.3,16.5\r\n13.1,15.3\r\n15.4,17.6\r\n12.6,14.4\r\n12,14.4\r\n11.8,14.2\r\n10,13.4\r\n10.9,13.5\r\n11.7,13.7\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Measure (a): Percentage of children living in households with less than 50 percent median equivalised disposable household income before housing costs are deducted, year ended June 2014\u20132024&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;R: revised. Error bars show 95 percent confidence intervals, between which we are confident that the true value lies. See Metadata tab for more information.&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;126377&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Low income &lt;em&gt;after&lt;\/em&gt; deducting housing costs \u2013 fixed-line measure (b)&lt;\/h2&gt;\n&lt;p&gt;In the year ended June 2024, 17.7 percent of children lived in households that had less than 50 percent of the baseline year\u2019s median equivalised disposable household income after housing costs were deducted (measure (b)).&lt;\/p&gt;\n&lt;p&gt;There was no statistically significant change to the rate from the year ended June 2023. The rate increased by 2.7 percentage points from the year ended June 2021. The rate decreased by 5.1 percentage points from the baseline year ended June 2018.&lt;\/p&gt;\n&lt;p&gt;Measure (b) compares the after-housing-costs household income in the current year with the median after-housing-costs income for all households in the year ended June 2018, adjusted for inflation. As such, it cannot be compared directly with the other low-income measures.&lt;\/p&gt;\n&lt;p&gt;This measure indicates whether household incomes for lower-income households were rising or falling over time, regardless of what happened to the incomes of other households.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;126736&quot;,&quot;Title&quot;:&quot;CPS Jun24 \u2013 g2 \u2013 Measure (b): Percentage of children living in households with less than 50 percent of the median equivalised disposable household income after deducting housing costs (for 2017\/18 financial year), year ended June 2014\u20132024&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Year ended June&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:&quot;&lt;p&gt;Household income after tax is \u2018equivalised\u2019, meaning that it is adjusted for the number of people in the household and their age, to allow for comparisons between households.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/methods\/child-poverty-statistics-year-ended-june-2024-technical-appendix\&quot;&gt;Child poverty statistics: Year ended June 2024 \u2012 technical appendix&lt;\/a&gt; provides more information on how this is calculated.&lt;\/p&gt;\n&lt;p&gt;This fixed-line measure uses the year ended June 2018 as the base year. It compares after-housing-costs household income in the current year with the median after-housing-costs income for all households in the year ended June 2018, adjusted for inflation.&lt;\/p&gt;&quot;,&quot;SeriesData&quot;:[{&quot;ID&quot;:33547,&quot;Title&quot;:&quot;Line&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffYear ended June,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023 R,2024\r\nPercent,27.3,27.2,24.3,22.4,22.8,18.3,17.8,15,14.4,17.7,17.7\r\n&quot;},{&quot;ID&quot;:33548,&quot;Title&quot;:&quot;Error&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;errorbar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeff24.4,30.2\r\n24.3,30.1\r\n22,26.6\r\n20,24.8\r\n20.9,24.7\r\n17.2,19.4\r\n16.5,19.1\r\n13.8,16.2\r\n12.7,16.1\r\n16.2,19.2\r\n16.5,18.9\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Measure (b): Percentage of children living in households with less than 50 percent of the median equivalised disposable household income after deducting housing costs (for 2017\/18 financial year), year ended June 2014\u20132024&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;R: revised. Error bars show 95 percent confidence intervals, between which we are confident that the true value lies. See Metadata tab for more information.&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;126378&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Material hardship \u2013 measure (c)&lt;\/h2&gt;\n&lt;p&gt;In the year ended June 2024, 13.4 percent of children lived in a household experiencing material hardship.&lt;\/p&gt;\n&lt;p&gt;There was no statistically significant change to the rate from the year ended June 2023. The rate increased by 2.4 percentage points from the year ended June 2021. There was no statistically significant change to the rate from the baseline year ended June 2018.&lt;\/p&gt;\n&lt;p&gt;A household that lacks six or more of 17 items on the DEP-17 index is defined as being in material hardship.&lt;\/p&gt;\n&lt;p&gt;Examples of items on the DEP-17 index include:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;going without fresh fruit or vegetables, because of the cost&lt;\/li&gt;\n&lt;li&gt;having to put up with feeling cold, to keep costs down&lt;\/li&gt;\n&lt;li&gt;unable to afford an unexpected $500 expense, without borrowing&lt;\/li&gt;\n&lt;li&gt;having to buy cheaper or less meat, because of the cost&lt;\/li&gt;\n&lt;li&gt;putting off doctor\u2019s visits, to keep costs down.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/measuring-child-poverty-material-hardship\/\&quot;&gt;Measuring child poverty: Material hardship&lt;\/a&gt; has a full list of the DEP-17 items.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;126737&quot;,&quot;Title&quot;:&quot;CPS Jun24 \u2013 g3 \u2013 Measure (c): Percentage of children living in households in material hardship, year ended June 2014\u20132024&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Year ended June&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:&quot;&lt;p&gt;A household is defined as being in material hardship if it lacks 6 or more of the 17 basic needs listed in the DEP-17 material deprivation index.&lt;\/p&gt;&quot;,&quot;SeriesData&quot;:[{&quot;ID&quot;:33549,&quot;Title&quot;:&quot;Line&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffYear ended June,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023 R,2024\r\nPercent,16,17.5,12.1,12.7,13.3,13.2,11.5,11,10.5,12.5,13.4\r\n&quot;},{&quot;ID&quot;:33550,&quot;Title&quot;:&quot;Error&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;errorbar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeff12.2,19.8\r\n13.2,21.8\r\n8.5,15.7\r\n10.3,15.1\r\n11,15.6\r\n12.1,14.3\r\n10.4,12.6\r\n10,12\r\n9,12\r\n11.3,13.7\r\n12.3,14.5\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Measure (c): Percentage of children living in households in material hardship, year ended June 2014\u20132024&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;R: revised. Error bars show 95 percent confidence intervals, between which we are confident that the true value lies. See Metadata tab for more information.&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;126919&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;As required by the Act, Stats NZ will provide annual reporting of official statistics on persistent child poverty from early 2027.&lt;\/p&gt;\n&lt;p&gt;In 2026 Stats NZ will provide estimates for persistent poverty for the year ended June 2024 and for the year ended June 2025, ahead of ongoing annual reporting commencing in early 2027.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/news\/stats-nz-delivers-on-its-commitment-to-measure-persistent-child-poverty\/\&quot;&gt;Stats NZ delivers on its commitment to measure persistent child poverty&lt;\/a&gt; has more information.&lt;\/p&gt;\n&lt;h2&gt;More data&lt;\/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;\/news\/no-movement-in-child-poverty-rates-for-year-ended-june-2024\/\&quot;&gt;No movement in child poverty rates for year ended June 2024&lt;\/a&gt; has information on child poverty by ethnic group and disability status.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/information-releases\/household-income-and-housing-cost-statistics-year-ended-june-2024\/\&quot;&gt;Household income and housing-cost statistics: Year ended June 2024&lt;\/a&gt; includes changes in incomes and housing costs.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/infographics\/how-we-measure-child-poverty\/\&quot;&gt;How we measure child poverty&lt;\/a&gt; is an infographic explaining the process of producing child poverty statistics.&lt;\/p&gt;\n&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/child-poverty-statistics-year-ended-june-2024-technical-appendix\/\&quot;&gt;Child poverty statistics: Year ended June 2024 \u2013 technical appendix&lt;\/a&gt; sets out our methodology for producing robust estimates of New Zealand\u2019s child poverty rates.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/www.legislation.govt.nz\/act\/public\/2018\/0057\/latest\/LMS8294.html\&quot;&gt;Child Poverty Reduction Act 2018&lt;\/a&gt; lists 10 child poverty measures and was introduced to help achieve a significant and sustained reduction in child poverty.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/27d850c1-939c-4e93-b61c-a1b5196b7f27?&amp;amp;_ga=2.205792851.1901218987.1644271304-251073822.1621811509#\/nz.govt.stats\/375fda94-7f95-4866-9756-8c1f0af32bf1\/\&quot;&gt;Household income and housing costs statistics \u2013 HES (Income) \u2013 DataInfo+&lt;\/a&gt; outlines the background to the survey, and the data quality and definitions in this release.&lt;\/p&gt;\n&lt;h2&gt;About the release&lt;\/h2&gt;\n&lt;p&gt;This is the sixth report on child poverty rates, as required under the &lt;a href=\&quot;https:\/\/www.legislation.govt.nz\/act\/public\/2018\/0057\/latest\/LMS8294.html\&quot;&gt;Child Poverty Reduction Act 2018&lt;\/a&gt;, since the redesign of the Household Economic Survey in the year ended June 2019.&lt;\/p&gt;\n&lt;p&gt;The year ended June 2024 data includes estimates of nine of the measures specified in the Act and compares data over the six years since the year ended June 2018.&lt;\/p&gt;\n&lt;p&gt;These include measures of low-income \u2013 before and after housing costs are deducted \u2013 and of material hardship at different levels of severity.&lt;\/p&gt;\n&lt;p&gt;The statistics are also produced by ethnicity and disability status, and regional council area.&lt;\/p&gt;\n&lt;p&gt;This is the last year of the Household Economic Survey in its current form. Child poverty statistics will be produced from 2025 onwards using the Household Income and Living Survey.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/help-with-surveys\/list-of-stats-nz-surveys\/about-the-household-income-and-living-survey\/\&quot;&gt;About the Household Income and Living Survey&lt;\/a&gt; has more information.&lt;\/p&gt;\n&lt;h2&gt;Interpreting child poverty statistics&lt;\/h2&gt;\n&lt;p&gt;Child poverty statistics were produced from the Household Economic Survey for the year ended June 2024.&lt;\/p&gt;\n&lt;p&gt;The suite of nine measures includes measures of low-income \u2013 before and after housing costs are deducted \u2013 and measures of material hardship at different levels of severity.&lt;\/p&gt;\n&lt;p&gt;One measure of low-income involves comparing a household\u2019s income for the particular year with an inflation-adjusted threshold based on the median of the baseline year (a fixed-line measure). As such, this measure (measure (b)) cannot be compared directly with the before-housing-costs measures because each of these are relative to the median of the same year, not the baseline year.&lt;\/p&gt;\n&lt;p&gt;The income measures of poverty presented in this release were based on equivalised disposable household income. This means household income after tax was adjusted for the number of people in the household and their age. A household\u2019s income was then compared with the median household income of the population, either before or after their housing costs have been deducted.&lt;\/p&gt;\n&lt;p&gt;Like all surveys, estimates are subject to some uncertainty because not everyone in New Zealand was surveyed. This range of uncertainty should be considered when looking at year-on-year changes. Stats NZ encourages users to look at trends over several years where possible. Small changes year-on-year are unlikely to be statistically significant because they fall within the range of expected uncertainty.&lt;\/p&gt;\n&lt;h2&gt;Data quality&lt;\/h2&gt;\n&lt;p&gt;The Household Economic Survey had a target sample size of 20,000 households, and an achieved sample size of approximately 19,100 households for the year ended June 2024.&lt;\/p&gt;\n&lt;p&gt;After thorough data quality analysis, Stats NZ is confident that the data produced for the year ended June 2024 is fit-for-purpose, within the margins of uncertainty on the estimates.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/child-poverty-statistics-year-ended-june-2024-technical-appendix\/\&quot;&gt;Child poverty statistics: Year ended June 2024 \u2013 technical appendix&lt;\/a&gt; provides more information on the analysis of data quality.&lt;\/p&gt;\n&lt;p&gt;Data collection for the year ended June 2022 was disrupted due to COVID-19 alert level restrictions, lockdowns, and other disruptions, which resulted in a significantly reduced sample size. Users should note that margins of error are high when using 2022 data.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/impacts-of-disrupted-data-collection-on-2022-household-economic-survey-statistics\/\&quot;&gt;Impacts of disrupted data collection on 2022 Household Economic Survey statistics&lt;\/a&gt; provides more information on the reduced sample size and the impacts.&lt;\/p&gt;\n&lt;h3&gt;Data updates to previously published statistics&lt;\/h3&gt;\n&lt;p&gt;We have updated previously published estimates of all nine child poverty measures for the year ended June 2023 using the most recently available administrative data from the &lt;a href=\&quot;\/integrated-data\/integrated-data-infrastructure\/\&quot;&gt;Integrated Data Infrastructure&lt;\/a&gt; and updated population estimates.&lt;\/p&gt;\n&lt;p&gt;Updates to the primary child poverty measures were as follows:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;measure (a), percentage of children living in households with less than 50 percent of the median equivalised disposable household income before deducting housing costs, decreased from 12.6 percent to 12.2 percent&lt;\/li&gt;\n&lt;li&gt;measure (b), percentage of children living in households with less than 50 percent of the median equivalised disposable household income after deducting housing costs (for the 2017\/2018 base financial year), increased from 17.5 percent to 17.7 percent&lt;\/li&gt;\n&lt;li&gt;measure (c), percentage of children living in households in material hardship, was unchanged from 12.5 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/applying-the-stats-nz-revisions-policy-to-outputs-from-the-household-economic-survey\/\&quot;&gt;Applying the Stats NZ revisions policy to outputs from the Household Economic Survey&lt;\/a&gt; sets out our policy for updating Household Economic Survey data.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;70522&quot;,&quot;Title&quot;:&quot;Child poverty statistics \u2013 media enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Media enquiries&lt;\/h2&gt;\n&lt;p&gt;Media team&lt;br&gt;&lt;a href=\&quot;mailto:media@stats.govt.nz?subject=Child%20poverty%20statistics%20%E2%80%93%20media%20enquiries\&quot;&gt;media@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+64212859191\&quot;&gt;021 285 9191&lt;br&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;126635&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 technical enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Technical enquiries&lt;\/h2&gt;\n&lt;p&gt;Household Financial Statistics&lt;br&gt;&lt;a href=\&quot;mailto:info@stats.govt.nz?subject=Child%20poverty%20statistics%20%E2%80%93%20technical%20enquiries\&quot;&gt;info@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+6449314600\&quot;&gt;&lt;br&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;24947&quot;,&quot;Title&quot;:&quot;ISSN child poverty statistics&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;ISSN 2624-2915&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;126380&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2024 \u2013 next release date&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Next release&lt;\/h2&gt;\n&lt;p&gt;&lt;em&gt;Child poverty statistics: Year ended June 2025&lt;\/em&gt; will be released in 2026.&lt;\/p&gt;&quot;}],&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;PageBlockSortOrder&quot;:{&quot;126944&quot;:1,&quot;126901&quot;:3,&quot;126375&quot;:4,&quot;126735&quot;:6,&quot;126377&quot;:7,&quot;126736&quot;:8,&quot;126378&qu
