in households with low income or experiencing material hardship for measures listed in the Child Poverty Reduction Act 2018.&lt;\/p&gt;&quot;,&quot;IsPublishing&quot;:false,&quot;MediaPosition&quot;:&quot;&quot;,&quot;PageLayout&quot;:&quot;info&quot;,&quot;PageLink&quot;:&quot;\/information-releases\/child-poverty-statistics-year-ended-june-2025\/&quot;,&quot;PageDate&quot;:&quot;2026-02-26 10:45:00&quot;,&quot;TagPosition&quot;:&quot;bottom&quot;,&quot;MetaDescription&quot;:&quot;In the year ended June 2025, 12.6 percent of children lived in households with less than 50 percent of the median equivalised disposable household income before housing costs were deducted (measure (a) of the Child Poverty Reduction Act 2018).&quot;,&quot;PageBreadcrumbs&quot;:[{&quot;Title&quot;:&quot;Home&quot;,&quot;MenuTitle&quot;:&quot;Home&quot;,&quot;Link&quot;:&quot;\/&quot;},{&quot;Title&quot;:&quot;Information releases&quot;,&quot;MenuTitle&quot;:&quot;Information releases&quot;,&quot;Link&quot;:&quot;\/information-releases\/&quot;},{&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025&quot;,&quot;MenuTitle&quot;:&quot;Child poverty statistics: Year ended June 2025&quot;,&quot;Link&quot;:&quot;\/information-releases\/child-poverty-statistics-year-ended-june-2025\/&quot;}],&quot;SiteBanner&quot;:[],&quot;PageBlocks&quot;:[{&quot;ID&quot;:&quot;135333&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 \u2013 callout block&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;div style=\&quot;background-color: #f6f6f6; border-left: #EC6607 3px solid; padding: 30px;\&quot;&gt;&lt;p&gt;&lt;strong&gt;29 September 2026:&lt;\/strong&gt; Errors have been identified in the Household Income and Living Survey (HILS) data for the year ended June 2025. The errors relate to how information about some people\u2019s highest qualifications was collected and processed and there are flow-on effects to household income-based statistics.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/reports\/error-notification-for-household-income-and-living-survey-hils-data-for-year-ended-june-2025\/\&quot;&gt;Error notification for Household Income and Living Survey (HILS) data for year ended June 2025&lt;\/a&gt;&lt;strong&gt; &lt;\/strong&gt;provides more information on the impacted data and the timeline for corrections.&lt;\/p&gt;\n&lt;p&gt;This release will remain available online and will not be updated. The corrections for child poverty measures will be released in February 2027 as part of the annual revisions for the next HILS child poverty release (year ended June 2026).&lt;\/p&gt;&lt;\/div&gt;&quot;},{&quot;ID&quot;:&quot;132356&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 - description&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;intro\&quot;&gt;Child poverty statistics provide estimates of the proportion of children in households with low income or experiencing material hardship for measures listed in the &lt;a href=\&quot;https:\/\/www.legislation.govt.nz\/act\/public\/2018\/0057\/latest\/LMS8294.html\&quot;&gt;Child Poverty Reduction Act 2018&lt;\/a&gt;.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;There are four primary measures of child poverty, and six supplementary measures. Targets for the primary measures are required to be set by the responsible minister.&lt;\/p&gt;\n&lt;p&gt;Statistics for nine child poverty measures, including annual changes, are available in the files under &lt;a href=\&quot;\/information-releases\/child-poverty-statistics-year-ended-june-2025\/#download-data\&quot;&gt;Download data&lt;\/a&gt; below. Figures are available by ethnicity, disability status, and regional council area.&lt;\/p&gt;\n&lt;p&gt;Reporting on persistent child poverty will commence in 2027, for the year ended June 2026.&lt;\/p&gt;\n&lt;p&gt;The Household Income and Living Survey (HILS) was established to replace the Household Economic Survey (HES) from July 2024.&lt;\/p&gt;\n&lt;p&gt;The HILS, from which these latest poverty rates were estimated, was conducted between July 2024 and June 2025. Households were asked to report income and housing costs expenditure for the 12 months prior to interview. This means that for some households, income refers to income received in the 2023\/2024 year.&lt;\/p&gt;\n&lt;p&gt;A change between two years is considered statistically significant if the difference between the estimates is larger than the sample error on the change.&lt;a id=\&quot;download-data\&quot;&gt;&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;132367&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 - download data&quot;,&quot;ClassName&quot;:&quot;DocumentBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;BlockDocuments&quot;:[{&quot;ID&quot;:&quot;122193&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;child-poverty-statistics-year-ended-june-2025.xlsx&quot;,&quot;FileName&quot;:&quot;child-poverty-statistics-year-ended-june-2025.xlsx&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:121629,&quot;OwnerID&quot;:37,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Child-poverty-statistics\/Child-poverty-statistics-Year-ended-June-2025\/Download-data\/child-poverty-statistics-year-ended-june-2025.xlsx&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xlsx&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1793625167&quot;,&quot;DocumentSize&quot;:&quot;242 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;122202&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;child-poverty-statistics-year-ended-june-2025.zip&quot;,&quot;FileName&quot;:&quot;child-poverty-statistics-year-ended-june-2025.zip&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 \u2013 CSV&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:121629,&quot;OwnerID&quot;:37,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Child-poverty-statistics\/Child-poverty-statistics-Year-ended-June-2025\/Download-data\/child-poverty-statistics-year-ended-june-2025.zip&quot;,&quot;DocumentCategory&quot;:&quot;archive&quot;,&quot;DocumentExtension&quot;:&quot;zip&quot;,&quot;DocumentFileType&quot;:&quot;ZIP compressed file&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/archive_92.png?m=1793625167&quot;,&quot;DocumentSize&quot;:&quot;80 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;122192&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;child-poverty-statistics-year-ended-june-2025-summary-table.xlsx&quot;,&quot;FileName&quot;:&quot;child-poverty-statistics-year-ended-june-2025-summary-table.xlsx&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 \u2013 summary table&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:121629,&quot;OwnerID&quot;:37,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Child-poverty-statistics\/Child-poverty-statistics-Year-ended-June-2025\/Download-data\/child-poverty-statistics-year-ended-june-2025-summary-table.xlsx&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xlsx&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1793625167&quot;,&quot;DocumentSize&quot;:&quot;29 KB&quot;,&quot;DocumentPreviewImage&quot;:false}],&quot;Heading&quot;:&quot;Download data&quot;,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}},&quot;Presentation&quot;:null},{&quot;ID&quot;:&quot;132357&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 - key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;\n&lt;p&gt;In the year ended June 2025:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For the primary measures:\n&lt;ul&gt;\n&lt;li&gt;12.6 percent of children lived in households with less than 50 percent of the median equivalised disposable household income before housing costs were deducted (measure (a) of the Child Poverty Reduction Act 2018)\n&lt;ul&gt;\n&lt;li&gt;There was no statistically significant change from the year ended June 2024.&lt;\/li&gt;\n&lt;li&gt;The rate was &lt;strong&gt;down &lt;\/strong&gt;3.9 percentage points when compared with the year ended June 2018 (the baseline year).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;li&gt;17.8 percent of children lived in households with less than 50 percent of the &lt;strong&gt;baseline year\u2019s&lt;\/strong&gt; median equivalised disposable household income after housing costs were deducted (measure (b))\n&lt;ul&gt;\n&lt;li&gt;There was no statistically significant change from the year ended June 2024.&lt;\/li&gt;\n&lt;li&gt;The rate was &lt;strong&gt;down &lt;\/strong&gt;5.0 percentage points when compared with the year ended June 2018 (the baseline year).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;li&gt;14.3 percent of children lived in households in material hardship (measure (c))\n&lt;ul&gt;\n&lt;li&gt;There was no statistically significant change from the year ended June 2024.&lt;\/li&gt;\n&lt;li&gt;There was no statistically significant change when compared with the year ended June 2018 (the baseline year).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;li&gt;For demographic groups:\n&lt;ul&gt;\n&lt;li&gt;The percentage living in households with less than 50 percent of the median equivalised disposable household income before housing costs were deducted (measure (a)):\n&lt;ul&gt;\n&lt;li&gt;for tamariki M\u0101ori was 14.9 percent, no statistically significant change from the year ended June 2024, and 3.0 percentage points lower than in the year ended June 2019.&lt;\/li&gt;\n&lt;li&gt;for Pacific children was 18.7 percent, 5.0 percentage points higher than in the year ended June 2024, no statistically significant change compared with the year ended June 2019.&lt;\/li&gt;\n&lt;li&gt;for disabled children was 13.3 percent, no statistically significant change from the year ended June 2024 or when compared with the year ended June 2020.&lt;\/li&gt;\n&lt;li&gt;for children in disabled households was 13.0 percent, no statistically significant change from the year ended June 2024, and 3.9 percentage points lower than in the year ended June 2020&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;li&gt;The percentage living in households with less than 50 percent of the baseline year\u2019s median equivalised disposable household income after housing costs were deducted (measure (b)):\n&lt;ul&gt;\n&lt;li&gt;for tamariki M\u0101ori was 18.9 percent, no statistically significant change from the year ended June 2024, and 4.0 percentage points lower than in the year ended June 2019.&lt;\/li&gt;\n&lt;li&gt;for Pacific children was 20.2 percent, no statistically significant change from the year ended June 2024 or when compared with the year ended June 2019.&lt;\/li&gt;\n&lt;li&gt;for disabled children was 19.9 percent, no statistically significant change from the year ended June 2024 or when compared with the year ended June 2020.&lt;\/li&gt;\n&lt;li&gt;for children in disabled households was 18.5 percent, no statistically significant change from the year ended June 2024 or when compared with the year ended June 2020.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;li&gt;The percentage living in households in material hardship (measure (c)):\n&lt;ul&gt;\n&lt;li&gt;for tamariki M\u0101ori was 25.1 percent, no statistically significant change from the year ended June 2024 or when compared with the year ended June 2019.&lt;\/li&gt;\n&lt;li&gt;for Pacific children was 31.0 percent, no statistically significant change from the year ended June 2024 or when compared with the year ended June 2019.&lt;\/li&gt;\n&lt;li&gt;for disabled children was 26.9 percent.&lt;\/li&gt;\n&lt;li&gt;for children in disabled households was 27.5 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Material hardship rates by disability status for children should not be compared between the Household Economic Survey and Housing Income and Living Survey, due to the combination of changes to the disability questions and the measurement of material hardship. A new time series will begin from the year ended June 2025.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/about-the-transition-from-the-household-economic-survey-to-the-household-income-and-living-survey\/\&quot;&gt;About the transition from the Household Economic Survey to the Household Income and Living Survey&lt;\/a&gt; has more information about these changes.&lt;\/p&gt;\n&lt;h2&gt;Low income &lt;em&gt;before &lt;\/em&gt;deducting housing costs \u2013 measure (a)&lt;\/h2&gt;\n&lt;p&gt;In the year ended June 2025, 12.6 percent of children lived in households that had less than 50 percent of the median equivalised disposable household income before housing costs were deducted (measure (a)).&lt;\/p&gt;\n&lt;p&gt;There was no statistically significant change to the rate from the year ended June 2024. The rate was 3.9 percentage points lower than in the baseline year ended June 2018.&lt;\/p&gt;\n&lt;p&gt;This measure of child poverty involves comparing a household\u2019s income for the previous 12 months with the median for all households for the year ended June 2025. For this measure to decrease over time, the incomes of low-income households would need to rise at a faster rate than the rise in the median household income (or fall at a slower rate than a fall in median household income).&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;132314&quot;,&quot;Title&quot;:&quot;CPS YE June 2025 - g1 - Measure (a): Percentage of children living in households with less than 50 percent median equivalised disposable household income before housing costs are deducted, year ended June, 2014\u20132025&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Year ended June&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;Household income after tax is \u2018equivalised\u2019, meaning that it is adjusted for the number of people in the household and their age, to allow for comparisons between households. &lt;a href=\&quot;[sitetree_link,id=80352]\&quot;&gt;Child poverty statistics: Year ended June 2025 \u2012 technical appendix&lt;\/a&gt; provides more information on how this is calculated.&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;SeriesData&quot;:[{&quot;ID&quot;:35084,&quot;Title&quot;:&quot;Measure (a): Percentage of children living in households with less than 50 percent median equivalised disposable household income before housing costs are deducted, year ended June, 2014\u20132025&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffYear ended June,2014,2015,2016,2017,2018,2019 RB,2020 RB,2021 RB,2022 RB,2023 RB,2024 R,2025\r\nPercent,14.5,16.3,15.4,14.2,16.5,13.6,13.3,12.9,11.7,12.1,12.7,12.6\r\n&quot;},{&quot;ID&quot;:35085,&quot;Title&quot;:&quot;Error&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;errorbar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeff13.4,15.6\r\n15.2,17.4\r\n14.3,16.5\r\n13.1,15.3\r\n15.4,17.6\r\n12.7,14.5\r\n12,14.6\r\n11.7,14.1\r\n10,13.4\r\n10.8,13.4\r\n11.7,13.7\r\n11.3,13.9\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Measure (a): Percentage of children living in households with less than 50 percent median equivalised disposable household income before housing costs are deducted, year ended June 2014\u20132025&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;R \u2013 revised. RB \u2013 rebased. Error bars show 95 percent confidence intervals between which we are confident that the true value lies. See metadata tab for more information. &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;132358&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 - key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Low income &lt;em&gt;after &lt;\/em&gt;deducting housing costs \u2013 fixed-line measure (b)&lt;\/h2&gt;\n&lt;p&gt;In the year ended June 2025, 17.8 percent of children lived in households that had less than 50 percent of the baseline year\u2019s median equivalised disposable household income after housing costs were deducted (measure (b)).&lt;\/p&gt;\n&lt;p&gt;There was no statistically significant change to the rate from the year ended June 2024. The rate was 5.0 percentage points lower than in the year ended June 2018.&lt;\/p&gt;\n&lt;p&gt;Measure (b) compares the after-housing-costs household income in the current year with the median after-housing-costs income for all households in the year ended June 2018, adjusted for inflation. As such, it cannot be compared directly with the relative low-income measures.&lt;\/p&gt;\n&lt;p&gt;This measure indicates whether household incomes for lower-income households were rising or falling over time in inflation-adjusted terms, regardless of what happened to the incomes of other households.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;132319&quot;,&quot;Title&quot;:&quot;CPS YE June 2025 - g2 - Measure (b): Percentage of children living in households with less than 50 percent of the median equivalised disposable household income after deducting housing costs (for 2017\/18 financial year), year ended June, 2014\u20132025&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Year ended June&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;Household income after tax is \u2018equivalised\u2019, meaning that it is adjusted for the number of people in the household and their age, to allow for comparisons between households. &lt;a href=\&quot;[sitetree_link,id=80352]\&quot;&gt;Child poverty statistics: Year ended June 2025 \u2012 technical appendix&lt;\/a&gt; provides more information on how this is calculated.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;This fixed-line measure uses the year ended June 2018 as the base year. It compares after-housing-costs household income in the current year with the median after-housing-costs income for all households in the year ended June 2018, adjusted for inflation.&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;SeriesData&quot;:[{&quot;ID&quot;:35088,&quot;Title&quot;:&quot;Measure (b): Percentage of children living in households with less than 50 percent of the median equivalised disposable household income after deducting housing costs (for 2017\/18 financial year), year ended June, 2014\u20132025&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffYear ended June,2014,2015,2016,2017,2018,2019 RB,2020 RB,2021 RB,2022 RB,2023 RB,2024 R,2025\r\nPercent,27.3,27.2,24.3,22.4,22.8,18.7,17.9,15,14.6,17.8,18.2,17.8\r\n&quot;},{&quot;ID&quot;:35089,&quot;Title&quot;:&quot;Error&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;errorbar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeff24.4,30.2\r\n24.3,30.1\r\n22,26.6\r\n20,24.8\r\n20.9,24.7\r\n17.6,19.8\r\n16.6,19.2\r\n13.8,16.2\r\n12.9,16.3\r\n16.3,19.3\r\n17,19.4\r\n16.7,18.9\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Measure (b): Percentage of children living in households with less than 50 percent of the median equivalised disposable household income after deducting housing costs (for 2017\/18 financial year), year ended June 2014\u20132025&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;R \u2013 revised. RB \u2013 rebased. Error bars show 95 percent confidence intervals, between which we are confident that the true value lies. See metadata tab for more information. &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;132359&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 - key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Material hardship \u2013 measure (c)&lt;\/h2&gt;\n&lt;p&gt;In the year ended June 2025, 14.3 percent of children lived in a household experiencing material hardship.&lt;\/p&gt;\n&lt;p&gt;There was no statistically significant change to the rate from the year ended June 2024 or to the rate from the baseline year ended June 2018.&lt;\/p&gt;\n&lt;p&gt;For data collected using the HILS, a household that lacks seven or more of the 18 items on the MH-18 index is defined as being in material hardship.&lt;\/p&gt;\n&lt;p&gt;Examples of items on the MH-18 index include:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;unable to afford a computer or internet at home, because of the cost&lt;\/li&gt;\n&lt;li&gt;having to put up with feeling cold, to keep costs down&lt;\/li&gt;\n&lt;li&gt;unable to afford an unexpected $500 expense, without borrowing&lt;\/li&gt;\n&lt;li&gt;having to buy cheaper or less meat, because of the cost&lt;\/li&gt;\n&lt;li&gt;putting off doctor\u2019s visits, to keep costs down.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Note that in the HES, the \u2018Dep-17\u2019 index with a threshold of six or more items was used to measure material hardship.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/measuring-child-poverty-material-hardship-in-the-household-income-and-living-survey\/\&quot;&gt;Measuring child poverty: Material hardship in the Household Income and Living Survey&lt;\/a&gt; has a full list of the MH-18 items and information about the methodology used to derive material hardship rates in Aotearoa New Zealand, including differences between the HES and the HILS.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;132320&quot;,&quot;Title&quot;:&quot;CPS YE June 2025 - g3 - Measure (c): Percentage of children living in households in material hardship, year ended June, 2014\u20132025&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Year ended June&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;A household is defined as being in material hardship if it lacks seven or more of the 18 basic needs listed in the MH-18 material deprivation index. &amp;nbsp;&amp;nbsp;&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;SeriesData&quot;:[{&quot;ID&quot;:35090,&quot;Title&quot;:&quot;Measure (c): Percentage of children living in households in material hardship, year ended June, 2014\u20132025&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffYear ended June,2014,2015,2016,2017,2018,2019 RB,2020 RB,2021 RB,2022 RB,2023 RB,2024 R,2025\r\nPercent,16,17.5,12.1,12.7,13.3,13.3,11.6,11,10.6,12.6,13.5,14.3\r\n&quot;},{&quot;ID&quot;:35091,&quot;Title&quot;:&quot;Error&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;errorbar&quot;,&quot;GraphCsvData&quot;:&quot;\ufeff12.2,19.8\r\n13.2,21.8\r\n8.5,15.7\r\n10.3,15.1\r\n11,15.6\r\n12.2,14.4\r\n10.5,12.7\r\n10,12\r\n9.1,12.1\r\n11.4,13.8\r\n12.3,14.7\r\n13.1,15.5\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Measure (c): Percentage of children living in households in material hardship, year ended June 2014\u20132025&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;R \u2013 revised. RB \u2013 rebased. Error bars show 95 percent confidence intervals, between which we are confident that the true value lies. See metadata tab for more information. &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;132360&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 - key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Persistent child poverty&lt;\/h2&gt;\n&lt;p&gt;In 2026 Stats NZ will provide estimates for persistent poverty for the year ended June 2024 and for the year ended June 2025, ahead of ongoing annual reporting commencing in early 2027.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/news\/stats-nz-delivers-on-its-commitment-to-measure-persistent-child-poverty\/\&quot;&gt;Stats NZ delivers on its commitment to measure persistent child poverty&lt;\/a&gt; has more information.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;132361&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 - more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;\/news\/no-annual-change-in-child-poverty-rates-for-year-ended-june-2025\/\&quot;&gt;No annual change in child poverty rates for year ended June 2025&lt;\/a&gt; has information on child poverty by ethnic group and disability status.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/information-releases\/household-income-and-housing-cost-statistics-year-ended-june-2025\/\&quot;&gt;Household income and housing-cost statistics: Year ended June 2025&lt;\/a&gt; includes statistics on household income and housing costs.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/infographics\/how-we-measure-child-poverty-2026\/\&quot;&gt;How we measure child poverty in the Household Income and Living Survey&lt;\/a&gt; is an infographic explaining the process of producing child poverty statistics.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;132362&quot;,&quot;Title&quot;:&quot;Child poverty statistics: Year ended June 2025 - definitions and metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/child-poverty-statistics-year-ended-june-2025-technical-appendix\/\&quot;&gt;Child poverty statistics: Year ended June 2025 \u2013 technical appendix&lt;\/a&gt; sets out our methodology for producing robust estimates of New Zealand\u2019s child poverty rates.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/www.legislation.govt.nz\/act\/public\/2018\/0057\/latest\/LMS8294.html\&quot;&gt;Child Poverty Reduction Act 2018&lt;\/a&gt; lists 10 child poverty measures and was introduced to help achieve a significant and sustained reduction in child poverty.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/9cd757c6-5e41-43e5-aa24-734c73a32989\&quot;&gt;Household income and housing costs statistics \u2013 HILS (Income) \u2013 DataInfo+&lt;\/a&gt; outlines the background to the survey, and the data quality and definitions in this release.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/about-the-transition-from-the-household-economic-survey-to-the-household-income-and-living-survey\/\&quot;&gt;About the transition from the Household Economic Survey to the Household Income and Living Survey&lt;\/a&gt; has more details about the key changes between the HES to the HILS.&lt;\/p&gt;\n&lt;h2&gt;About child poverty statistics&lt;\/h2&gt;\n&lt;p&gt;The nine measures reported here include measures of low-income \u2013 before and after housing costs are deducted \u2013 and measures of material hardship at different levels of severity.&lt;\/p&gt;\n&lt;p&gt;The income measures of poverty presented in this release are based on equivalised disposable household income. Household size and composition affect the income received and costs incurred by a household. We use an equivalisation process to adjust for these factors, so that we can better compare living standards across households. &amp;nbsp; A household\u2019s disposable income \u2013 either before or after housing costs have been deducted \u2013 is equivalised and then compared with the corresponding median household equivalised income of the population.&lt;\/p&gt;\n&lt;p&gt;One measure of low-income (measure (b)) compares a household\u2019s income for a particular year with an inflation-adjusted threshold based on the median of the baseline year (a fixed-line measure). As such, this measure cannot be compared directly with the other low-income measures because each of these are relative to the median of the same year, not the baseline year.&lt;\/p&gt;\n&lt;p&gt;This is the seventh report on child poverty rates, as required under the &lt;a href=\&quot;https:\/\/www.legislation.govt.nz\/act\/public\/2018\/0057\/latest\/LMS8294.html\&quot;&gt;Child Poverty Reduction Act 2018&lt;\/a&gt;, since the redesign of the Household Economic Survey in the year ended June 2019. This year\u2019s report is the first to use data collected from the Household Income and Living Survey.&lt;\/p&gt;\n&lt;p&gt;The Household Income and Living Survey has a target sample size of 17,000 households and achieved a sample size of approximately 17,892 households for the year ended June 2025.&lt;\/p&gt;\n&lt;p&gt;Like all surveys, estimates are subject to some uncertainty because not everyone in New Zealand was surveyed. This range of uncertainty should be considered when looking at year-on-year changes. Stats NZ encourages users to look at trends over several years where possible. Small changes year-on-year are unlikely to be statistically significant because they fall within the range of expected uncertainty.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/child-poverty-statistics-year-ended-june-2025-technical-appendix\/\&quot;&gt;Child poverty statistics: Year ended June 2025 \u2013 technical appendix&lt;\/a&gt; provides more information on the survey methodology and analysis of data quality.&lt;\/p&gt;\n&lt;h2&gt;Data updates to previously published statistics&lt;\/h2&gt;\n&lt;p&gt;On 12 February 2026 we published revised child poverty statistics for the years ended June 2019 to 2024 as part of the population rebase.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/household-economic-survey-population-rebase-year-ended-june-2019-to-2024\/\&quot;&gt;Household Economic Survey population rebase: Year ended June 2019 to 2024&lt;\/a&gt; provides further information on the population rebase and its impact on estimates.&lt;\/p&gt;\n&lt;p&gt;In &lt;em&gt;Child Poverty statistics: Year ended June 2025&lt;\/em&gt; (this release), we have also updated the estimates for nine child poverty measures for the year ended June 2024 using the most recently available administrative data from the &lt;a href=\&quot;https:\/\/www.stats.govt.nz\/integrated-data\/integrated-data-infrastructure\/\&quot;&gt;Integrated Data Infrastructure&lt;\/a&gt; and population estimates.&lt;\/p&gt;\n&lt;p&gt;Compared with the first release of statistics for the year ended June 2024 (published February 2025), the total impact of these updates to the primary child poverty measures was as follows:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;measure (a), the percentage of children living in households with less than 50 percent of the median equivalised disposable household income before deducting housing costs, was unchanged at 12.7 percent&lt;\/li&gt;\n&lt;li&gt;measure (b), the percentage of children living in households with less than 50 percent of the median equivalised disposable household income after deducting housing costs (for the 2017\/2018 base financial year), changed from 17.7 percent to 18.2 percent&lt;\/li&gt;\n&lt;li&gt;measure (c), the percentage of children living in households in material hardship, changed from 13.4 percent to 13.5 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/applying-the-stats-nz-revisions-policy-to-outputs-from-the-household-economic-survey\/\&quot;&gt;Applying the Stats NZ revisions policy to outputs from the Household Economic Survey&lt;\/a&gt; sets out our policy for updating household economic data.&lt;\/p&gt;\n&lt;p&gt;The table below shows the differences between the primary child poverty measures for each release containing data for 2024.&lt;\/p&gt;\n&lt;table class=\&quot;stats-bordered\&quot; style=\&quot;border-collapse: collapse; width: 100%; border-width: 1px;\&quot;&gt;&lt;caption&gt;&lt;strong&gt;Data updates to primary measures for the year ended June 2024&lt;\/strong&gt;&lt;\/caption&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;150\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;&amp;nbsp;&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; width=\&quot;150\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Original published estimate&lt;br&gt;(unrevised)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; width=\&quot;150\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Rebased estimate&lt;br&gt;(12th February 2026 release)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; width=\&quot;150\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Revised estimate&lt;br&gt;(26th February release)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;150\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Measure (a)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; width=\&quot;150\&quot;&gt;\n&lt;p&gt;12.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; width=\&quot;150\&quot;&gt;\n&lt;p&gt;12.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; width=\&quot;150\&quot;&gt;\n&lt;p&gt;12.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;150\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Measure (b)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; width=\&quot;150\&quot;&gt;\n&lt;p&gt;17.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-center\&quot; width=\&quot;150\&quot;&gt;\n&lt;p&gt;17.8&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td class=\&quot;text-cen
