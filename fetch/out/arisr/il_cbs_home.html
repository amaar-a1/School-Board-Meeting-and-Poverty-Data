    he: "התחדשנו",
    en: "We've Upgraded",
}

const hidePop = () => {
    const po = document.getElementById("popovercontainer");
    po.hidePopover();
}

const closeBTN = () => {
    return createDOMElement(
        "button",
        [
            "closeButton",
            "clickable",
        ],
        "",
        [
            { Type: "click", Method: hidePop, MethodArguments:null }
        ],
        "X",
        [],
        [
            {key: "type", value: "button"},
            {key: "popovertarget", value: "popovercontainer"}
        ]
    ) 
}

const checkAndShowPopup = async () => {
    if (await testcoo()){
        const po = document.getElementById("popoverflex");

        po.appendChild(createDOMElement(
            "img",
            [],
            "",
            [
                { Type: "click", Method: hidePop, MethodArguments:null }
            ],
            "",
            [
                {key:"width", value:`70%`},
            ],
            [
                {key:"title", value: `${poTitle.he}!`},
                {key:"src", value:`/SiteCollectionImages/${popoverGraphicFileName}`}
            ]
        ));

        po.appendChild(closeBTN());
        const pc = document.getElementById("popovercontainer");
        pc.showPopover();

        let dtNow = new Date();
        localStorage.setItem("renewalpopup",dtNow.toISOString())
    }
}

const testcoo = async () => {
    let result = true;
    let coo = await localStorage.getItem("renewalpopup");
    if (coo){
        let lastViewed = new Date(coo);
        let now = new Date;
        if (now - lastViewed < popupInterval * 3600000){
            result = false;
        }
    }
    return result
}

            break;
    }
}, false);
