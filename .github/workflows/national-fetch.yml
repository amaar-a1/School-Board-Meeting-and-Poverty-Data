name: Fetch pages for national research (temporary)

on:
  push:
    branches: [claude/national-fetch]
    paths: [fetch/urls.txt, fetch/paginate.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download each URL in fetch/urls.txt
        run: |
          mkdir -p fetch/out
          : > fetch/out/index.tsv
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            code=$(curl -sSL -A "Mozilla/5.0 (school-board research project; github.com/amaar-a1)" -m 120 -o "fetch/out/$name" -w "%{http_code}" "$url" || echo ERR)
            printf "%s\t%s\t%s\t%s\n" "$name" "$code" "$(stat -c %s "fetch/out/$name" 2>/dev/null || echo 0)" "$url" >> fetch/out/index.tsv
            sleep 20
          done < fetch/urls.txt
          cat fetch/out/index.tsv
      - name: Download paginated APIs listed in fetch/paginate.txt
        run: |
          [ -f fetch/paginate.txt ] || exit 0
          python3 - <<'PY'
          import json, urllib.request, time
          for line in open("fetch/paginate.txt"):
              line = line.strip()
              if not line or line.startswith("#"): continue
              name, url = line.split(None, 1)
              rows = []
              while url:
                  with urllib.request.urlopen(url, timeout=300) as r:
                      d = json.load(r)
                  rows += d["results"]; url = d.get("next"); time.sleep(1)
              json.dump(rows, open(f"fetch/out/{name}", "w"))
              print(name, len(rows), "rows")
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetch/out
          git commit -m "Fetched pages" || echo "nothing new"
          git push
