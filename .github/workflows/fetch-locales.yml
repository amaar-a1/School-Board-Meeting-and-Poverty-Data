name: Fetch NCES locale codes (temporary)

on:
  push:
    branches: [claude/fetch-locales]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Texas district directory (NCES CCD via Urban Institute Education Data API)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          out = None
          for year in (2023, 2022, 2021, 2020):
              url = f"https://educationdata.urban.org/api/v1/school-districts/ccd/directory/{year}/?fips=48"
              rows = []
              try:
                  while url:
                      with urllib.request.urlopen(url, timeout=120) as r:
                          d = json.load(r)
                      rows += d["results"]
                      url = d.get("next")
              except Exception as e:
                  print(year, "failed:", e)
                  continue
              print(year, len(rows), "rows")
              if rows:
                  out = {"year": year, "rows": rows}
                  break
          keep = ["leaid", "lea_name", "county_name", "county_code", "urban_centric_locale", "agency_type", "enrollment", "city_location"]
          out["rows"] = [{k: r.get(k) for k in keep} for r in out["rows"]]
          json.dump(out, open("tx_districts_nces.json", "w"), indent=0)
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tx_districts_nces.json
          git commit -m "Add NCES Texas district locale data"
          git push
